<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Man Audio Hub</title>
  <style>
    body { 
      background-color: #0b0c10; 
      color: #c5c6c7; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 0;
    }

    .main-container { 
      max-width: 480px; 
      margin: 0 auto; 
      padding: 15px; 
    }

    /* Armor Container */
    .ironman-wrapper { 
      position: relative; 
      display: inline-block; 
      margin-top: 15px; 
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
    }

    .armor-img { 
      width: 100%; 
      max-width: 320px; 
      display: block; 
      margin: 0 auto;
    }

    /* Clickable Arc Reactor Overlay */
    .arc-reactor-btn {
      position: absolute; 
      top: 83%;            /* Adjust percentage to move UP / DOWN */
      left: 43.5%;           /* Adjust percentage to move LEFT / RIGHT */
      width: 42px; 
      height: 42px;
      border-radius: 50%; 
      background: transparent; 
      cursor: pointer; 
      transition: all 0.3s ease-in-out;
      border: 1px solid rgba(0, 255, 255, 0.3);
    }

    /* Glow Effect when Activated */
    .arc-reactor-btn.active { 
      background: rgba(220, 245, 255, 0.85); 
      box-shadow: 0 0 25px 12px #00ffff, inset 0 0 15px #ffffff; 
      border-color: #ffffff;
    }

    /* Playlist Layout */
    .playlist-card { 
      background: #1f2833; 
      padding: 15px; 
      margin-top: 25px; 
      border-top: 3px solid #66fcf1; 
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    h2 { 
      color: #66fcf1; 
      font-size: 18px; 
      margin-top: 0;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    iframe {
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- Iron Man Section -->
    <div class="ironman-wrapper">
      <!-- Your New PostImage Link -->
      <img src="https://i.postimg.cc/ZnyZySHb/36ac3f2c-7d3d-4fb0-8973-fb1ba1921669.jpg" alt="Iron Man Armor" class="armor-img" />
      
      <!-- Clickable Chest Reactor -->
      <div id="arcReactor" class="arc-reactor-btn" onclick="toggleArcReactor()"></div>
    </div>

    <!-- Repulsor Sound File -->
    <audio id="repulsorSound" src="https://www.myinstants.com/media/sounds/iron-man-repulsor.mp3"></audio>

    <!-- Tuning Playlist Section -->
    <div class="playlist-card">
      <h2>My Tuning Playlist</h2>
      <iframe width="100%" height="300" src="https://www.youtube-nocookie.com/embed/videoseries?list=PLUYN_uWzBs6slF89sI95D1L_LtrEAI76I" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

  </div>

  <!-- Interactive JavaScript -->
  <script>
    function toggleArcReactor() {
      const reactor = document.getElementById("arcReactor");
      const sound = document.getElementById("repulsorSound");
      
      reactor.classList.toggle("active");
      
      if (reactor.classList.contains("active")) { 
        sound.currentTime = 0; 
        sound.play(); 
      } else { 
        sound.pause(); 
      }
    }
  </script>

</body>
</html>
