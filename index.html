<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - System Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stark: {
                            blue: '#00e5ff',
                            dark: '#0a192f',
                            gold: '#ffd700',
                            red: '#ff003c'
                        }
                    },
                    fontFamily: {
                        tech: ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Share Tech Mono', monospace;
            color: #00e5ff;
            background-image: url('https://i.postimg.cc/ZnyZySHb/36ac3f2c-7d3d-4fb0-8973-fb1ba1921669.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hud-overlay {
            background: radial-gradient(circle at center, rgba(10, 25, 47, 0.2) 0%, rgba(0, 0, 0, 0.8) 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 2rem;
            position: relative;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,229,255,0.05) 50%, rgba(0,229,255,0.05));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        .terminal-container {
            background: rgba(10, 25, 47, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        #terminal-output::-webkit-scrollbar {
            width: 5px;
        }
        #terminal-output::-webkit-scrollbar-thumb {
            background: #00e5ff;
        }

        .glitch {
            animation: glitch 1.5s linear infinite;
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }

        /* Make the YouTube player visually blend with the HUD */
        #yt-player-wrapper iframe {
            width: 100%;
            height: 100%;
            pointer-events: auto; /* Allow the user to click play manually if needed */
        }
    </style>
</head>
<body>
    <div class="hud-overlay">
        <!-- Top HUD Elements -->
        <div class="flex justify-between items-start w-full z-10">
            <div class="text-stark-blue">
                <h1 class="text-4xl font-bold tracking-widest uppercase glitch">J.A.R.V.I.S.</h1>
                <p class="text-sm tracking-widest mt-1 opacity-70">Mark XLII OS // ONLINE</p>
            </div>
            <div class="text-right">
                <p class="text-xl tracking-widest text-stark-gold" id="clock">00:00:00</p>
                <p class="text-xs tracking-widest text-stark-blue opacity-70">SYSTEM STATUS: NOMINAL</p>
            </div>
        </div>

        <!-- Center Visualization -->
        <div class="flex-grow flex items-center justify-center relative z-10">
            <canvas id="visualizer" width="400" height="400" class="absolute"></canvas>
            
            <button id="init-btn" class="px-8 py-4 bg-black/50 border-2 border-stark-blue text-stark-blue font-bold text-xl tracking-widest uppercase hover:bg-stark-blue hover:text-black transition-all duration-300 rounded shadow-[0_0_15px_rgba(0,229,255,0.5)] backdrop-blur-sm z-20">
                Initialize System
            </button>
        </div>

        <!-- Bottom Terminal and Player Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full z-10">
            
            <!-- AI Terminal -->
            <div class="terminal-container p-4 rounded h-72 flex flex-col">
                <div class="flex justify-between items-center border-b border-stark-blue pb-2 mb-2">
                    <span class="text-stark-blue uppercase tracking-widest text-sm font-bold">System Logs & AI Link</span>
                    <span class="text-xs text-stark-gold animate-pulse">REC</span>
                </div>
                <div id="terminal-output" class="flex-grow overflow-y-auto text-sm space-y-2 mb-2 text-stark-blue/80 font-mono">
                    <div>[SYSTEM] Waiting for initialization sequence...</div>
                </div>
                <div class="flex items-center mt-2 border-t border-stark-blue/30 pt-2">
                    <span class="text-stark-gold mr-2 font-bold">></span>
                    <input type="text" id="terminal-input" class="w-full bg-transparent border-none outline-none text-stark-blue placeholder-stark-blue/30" placeholder="Ask J.A.R.V.I.S..." disabled autocomplete="off">
                </div>
            </div>

            <!-- VISIBLE Media Player Panel -->
            <div class="terminal-container p-4 rounded h-72 flex flex-col">
                <div class="flex justify-between items-center border-b border-stark-blue pb-2 mb-3">
                    <h3 class="text-stark-blue uppercase tracking-widest text-sm font-bold">Media Stream Node</h3>
                    <span id="audio-status" class="text-xs text-stark-gold font-bold">STANDBY</span>
                </div>
                
                <!-- The Visible YouTube Window -->
                <div id="yt-player-wrapper" class="w-full flex-grow bg-black/80 border border-stark-blue/30 rounded relative overflow-hidden flex items-center justify-center">
                    <!-- YouTube Player Will Inject Here -->
                    <div id="yt-player"></div>
                </div>

                <div class="flex justify-between items-center mt-3">
                    <button id="skip-btn" class="text-stark-blue hover:text-black text-xs uppercase tracking-widest border border-stark-blue px-3 py-1 rounded opacity-50 cursor-not-allowed transition-colors">
                        Force Skip Track
                    </button>
                    <div class="text-[10px] text-stark-blue/60 text-right">
                        Playlist ID: PLLncydMcuuiQ
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="scanlines"></div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // System variables
        const PLAYLIST_ID = "PLLncydMcuuiQ"; 
        const GEMINI_API_KEY = ""; // Kept empty so Canvas environment automatically handles AI logic.

        const UI = {
            initBtn: document.getElementById('init-btn'),
            terminalOutput: document.getElementById('terminal-output'),
            terminalInput: document.getElementById('terminal-input'),
            audioStatus: document.getElementById('audio-status'),
            skipBtn: document.getElementById('skip-btn'),
            clock: document.getElementById('clock'),
            canvas: document.getElementById('visualizer'),
            ctx: document.getElementById('visualizer').getContext('2d')
        };

        let isSystemOnline = false;
        let ytPlayer = null;
        let isYtReady = false;
        let visualizerAnimationFrame;

        // Clock logic
        function updateClock() {
            const now = new Date();
            UI.clock.textContent = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + now.getMilliseconds().toString().padStart(3, '0').substring(0,2);
            requestAnimationFrame(updateClock);
        }
        updateClock();

        // Terminal Log function
        function logTerminal(htmlMessage) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<span class="text-stark-blue/50">[${time}]</span> ${htmlMessage}`;
            UI.terminalOutput.appendChild(msgDiv);
            UI.terminalOutput.scrollTop = UI.terminalOutput.scrollHeight;
        }

        // YouTube API Setup
        function onYouTubeIframeAPIReady() {
            logTerminal("<span class='text-stark-gold'>[SYSTEM] Establishing connection to global media network...</span>");
            
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    listType: 'playlist',
                    list: PLAYLIST_ID,
                    autoplay: 0,
                    controls: 1, // ENABLED CONTROLS so you can interact with it if needed
                    disablekb: 0,
                    modestbranding: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            isYtReady = true;
            logTerminal("<span class='text-stark-blue'>[MEDIA NODE] Connected successfully.</span>");
            
            if (isSystemOnline) {
                playAudio();
            }
        }

        function playAudio() {
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo();
                UI.audioStatus.textContent = "CONNECTING...";
            }
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                UI.audioStatus.textContent = "STREAMING";
                UI.audioStatus.className = "text-xs text-stark-blue font-bold animate-pulse";
                startVisualizer(true);
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                UI.audioStatus.textContent = "STANDBY";
                UI.audioStatus.className = "text-xs text-stark-gold font-bold";
                startVisualizer(false);
            }
        }

        function onPlayerError(event) {
            const errCode = event.data;
            UI.audioStatus.textContent = "BLOCKED";
            UI.audioStatus.className = "text-xs text-red-500 font-bold";
            startVisualizer(false);

            // Log exact error to terminal so the user knows it's YouTube, not the code.
            if (errCode === 150 || errCode === 101 || errCode === 153) {
                logTerminal("<span class='text-red-500 font-bold'>[WARNING] YouTube Copyright System blocked this track.</span>");
                logTerminal("<span class='text-stark-gold'>[INFO] Look at the Media Node. If it says 'Video Unavailable', YouTube's DRM is preventing playback in this window. Click 'Force Skip Track' to try the next song.</span>");
            } else {
                logTerminal(`<span class='text-red-500'>[ERROR] Player encountered code: ${errCode}</span>`);
            }
        }

        // Initialize Button Click
        UI.initBtn.addEventListener('click', () => {
            isSystemOnline = true;
            UI.initBtn.style.display = 'none';
            UI.terminalInput.disabled = false;
            UI.terminalInput.focus();
            
            UI.skipBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            UI.skipBtn.classList.add('hover:bg-stark-blue', 'hover:text-black');

            logTerminal("<span class='text-stark-blue font-bold'>[SYSTEM] Boot sequence initiated...</span>");
            startVisualizer(false);

            if (isYtReady) {
                playAudio();
            } else {
                logTerminal("<span class='text-stark-gold'>[SYSTEM] Waiting for YouTube API to finish loading...</span>");
            }
        });

        // Skip Button Logic
        UI.skipBtn.addEventListener('click', () => {
            if (isSystemOnline && ytPlayer && typeof ytPlayer.nextVideo === 'function') {
                logTerminal("<span class='text-stark-gold'>[COMMAND] Skipping to next node...</span>");
                ytPlayer.nextVideo();
            }
        });

        // Gemini AI Logic
        async function sendToJarvis(prompt) {
            logTerminal(`<span class="text-white">User: ${prompt}</span>`);
            UI.terminalInput.value = '';
            UI.terminalInput.disabled = true;
            
            const typingIndicatorId = "typing-" + Date.now();
            logTerminal(`<span id="${typingIndicatorId}" class="text-stark-gold">J.A.R.V.I.S. is processing...</span>`);

            try {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { 
                        parts: [{ text: "Act as J.A.R.V.I.S., Tony Stark's AI assistant. Keep responses under 3 sentences for the HUD display." }] 
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                document.getElementById(typingIndicatorId)?.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    logTerminal(`<span class="text-stark-blue font-bold">J.A.R.V.I.S.:</span> <span class="text-stark-blue">${reply}</span>`);
                } else {
                    throw new Error("Invalid API response");
                }
            } catch (error) {
                document.getElementById(typingIndicatorId)?.remove();
                logTerminal(`<span class="text-red-500">[AI ERROR] Neural link offline.</span>`);
            } finally {
                UI.terminalInput.disabled = false;
                UI.terminalInput.focus();
            }
        }

        UI.terminalInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && UI.terminalInput.value.trim() !== '') {
                sendToJarvis(UI.terminalInput.value.trim());
            }
        });

        // Dynamic Canvas Visualizer
        function startVisualizer(isActiveAudio) {
            const cx = UI.canvas.width / 2;
            const cy = UI.canvas.height / 2;
            const radius = 120;
            
            cancelAnimationFrame(visualizerAnimationFrame);

            function draw() {
                UI.ctx.clearRect(0, 0, UI.canvas.width, UI.canvas.height);
                
                UI.ctx.strokeStyle = 'rgba(0, 229, 255, 0.2)';
                UI.ctx.lineWidth = 2;
                UI.ctx.beginPath();
                UI.ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                UI.ctx.stroke();

                UI.ctx.beginPath();
                UI.ctx.arc(cx, cy, radius + 20, 0, Math.PI * 2);
                UI.ctx.stroke();

                const bars = 64;
                const angleStep = (Math.PI * 2) / bars;
                
                for (let i = 0; i < bars; i++) {
                    const angle = i * angleStep;
                    const barHeight = isActiveAudio 
                        ? (Math.random() * 40 + 10) 
                        : (Math.sin(Date.now() / 500 + i) * 5 + 10);
                    
                    const x1 = cx + Math.cos(angle) * radius;
                    const y1 = cy + Math.sin(angle) * radius;
                    const x2 = cx + Math.cos(angle) * (radius - barHeight);
                    const y2 = cy + Math.sin(angle) * (radius - barHeight);

                    UI.ctx.strokeStyle = isActiveAudio ? '#00e5ff' : 'rgba(0, 229, 255, 0.5)';
                    UI.ctx.lineWidth = 3;
                    UI.ctx.beginPath();
                    UI.ctx.moveTo(x1, y1);
                    UI.ctx.lineTo(x2, y2);
                    UI.ctx.stroke();
                }

                UI.ctx.save();
                UI.ctx.translate(cx, cy);
                UI.ctx.rotate(Date.now() / 1000);
                UI.ctx.setLineDash([15, 10]);
                UI.ctx.strokeStyle = '#ffd700';
                UI.ctx.beginPath();
                UI.ctx.arc(0, 0, radius - 60, 0, Math.PI * 2);
                UI.ctx.stroke();
                UI.ctx.restore();

                visualizerAnimationFrame = requestAnimationFrame(draw);
            }
            
            draw();
        }

        // Offline initial draw state
        UI.ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
        UI.ctx.lineWidth = 1;
        UI.ctx.beginPath();
        UI.ctx.arc(UI.canvas.width/2, UI.canvas.height/2, 120, 0, Math.PI * 2);
        UI.ctx.stroke();
    </script>
</body>
  </html>
